name: Build TC001 Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 platform
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      - name: Install libraries
        run: |
          arduino-cli lib install "WiFiManager"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit NeoMatrix"
          arduino-cli lib install "Adafruit NeoPixel"
          arduino-cli lib install "ArduinoJson"
      - name: Compile firmware
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir build/ sketch/
      - name: Rename output files
        run: |
          cp build/sketch.ino.bin build/customfirmware.bin
          cp build/sketch.ino.bootloader.bin build/bootloader.bin
          cp build/sketch.ino.partitions.bin build/partitions.bin
          find /root/.arduino15 -name "boot_app0.bin" | head -1 | xargs -I{} cp {} build/boot_app0.bin
      - uses: actions/upload-artifact@v4
        with:
          name: TC001-white-text-firmware
          path: |
            build/customfirmware.bin
            build/bootloader.bin
            build/partitions.bin
            build/boot_app0.bin
          retention-days: 30
